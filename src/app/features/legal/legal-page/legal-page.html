<main class="bg-slate py-12 px-6 animate-in fade-in duration-500" *ngIf="page">

  <div class="max-w-4xl mx-auto">

    <!-- botón volver -->
    <button
      routerLink="/"
      class="mb-8 text-slate-500 text-[10px] font-black uppercase tracking-widest hover:text-slate-800 transition flex items-center gap-2">
      <i class="fa-solid fa-arrow-left"></i>
      Volver al Portal
    </button>

    <!-- documento -->
    <div class="bg-white border border-slate-200 rounded-3xl p-10 shadow-xl">

      <!-- header legal -->
      <header class="flex justify-between items-start mb-10 border-b border-slate-100 pb-6">

        <div>
          <h3 class="text-xl font-black tracking-tight uppercase m-0">
            Sobre de Fortuna Digital
          </h3>

          <p class="text-[9px] font-bold text-slate-400 tracking-[0.3em] uppercase mt-1">
            Legal & Compliance Office
          </p>
        </div>

        <div class="text-right">
          <div
            class="text-[9px] font-black bg-slate-100 px-3 py-1 rounded border border-slate-200 text-slate-500">
            OFICIAL / VERIFICADO
          </div>

          <p class="text-[9px] text-slate-400 font-bold mt-2 tracking-widest">
            REF: SFD-2026
          </p>
        </div>

      </header>

      <!-- título -->
      <h1 class="text-4xl md:text-5xl font-black text-slate-900 mb-10 tracking-tight leading-none font-serif">
        {{ page.title }}
      </h1>

      <!-- contenido markdown -->
      <div
        class="prose prose-slate max-w-none prose-headings:font-black prose-h2:text-xl prose-h3:text-lg"
        [innerHTML]="htmlContent">
      </div>

      <!-- footer documento -->
      <footer class="mt-20 pt-10 border-t border-slate-100 flex justify-between items-center">

        <div class="text-[9px] text-slate-400 font-medium max-w-xs">
          Documento generado electrónicamente por Sobre de Fortuna Digital.
          Reservados todos los derechos.
        </div>

        <div class="text-right">
          <div class="w-24 h-px bg-slate-300 ml-auto mb-2"></div>
          <p class="text-[8px] font-black text-slate-400 uppercase tracking-widest">
            Firma Autorizada
          </p>
        </div>

      </footer>

    </div>

  </div>

</main>
